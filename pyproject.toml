[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trail-hyper"
version = "0.1.0"
description = "Temporal recurrent RL-ready semantic abstraction for evolving knowledge hypergraphs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "neo4j>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trail-hyper = "trail_hyper.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
